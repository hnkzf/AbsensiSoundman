<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Absensi</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background: #f4f6f9; padding: 20px; margin: 0; display: flex; justify-content: center; }
    .card { background: #fff; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-top: 0; color: #333; }
    label { font-weight: bold; font-size: 14px; display: block; margin-top: 12px; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .camera-box { position: relative; width: 100%; height: 260px; background: #000; border-radius: 8px; margin-top: 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video, img#preview { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    img#preview { display: none; transform: none; }
    button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-cam { background: #3b82f6; color: white; }
    .btn-snap { background: #10b981; color: white; }
    .btn-send { background: #059669; color: white; margin-top: 15px; }
    .btn-send:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; font-size: 13px; display: none; }
    .info { background: #e0f2fe; color: #0369a1; }
    .success { background: #d1fae5; color: #047857; }
    .error { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

<div class="card">
  <h2>Absensi Selfie</h2>

  <label for="nama">Nama Lengkap</label>
  <input type="text" id="nama" placeholder="Masukkan nama...">

  <label for="acara">Nama Acara</label>
  <input type="text" id="acara" placeholder="Contoh: Rapat Mingguan">

  <!-- Area Kamera & Preview -->
  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <img id="preview" alt="Preview Foto">
  </div>
  <canvas id="canvas" style="display:none;"></canvas>

  <button type="button" class="btn-cam" onclick="startCamera()">📷 Buka Kamera</button>
  <button type="button" class="btn-snap" id="btnSnap" onclick="takePhoto()" disabled>📸 Ambil Foto</button>
  <button type="button" class="btn-send" id="btnSend" onclick="sendData()" disabled>✅ Kirim Absensi</button>

  <div id="status"></div>
</div>

<script>
  // GANTI LINK DI BAWAH INI DENGAN URL WEB APP HASIL DEPLOY ANDA
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBA4AKp3-5jbC4ntVilgUee2jyujTlSvir3PH8ZOgSm96xCi6N6zqUQT4Gb-77gP1RKw/exec";

  let stream = null;
  let fotoBase64 = null;

  // 1. MENGAKTIFKAN KAMERA
  async function startCamera() {
    showStatus("Meminta izin akses kamera...", "info");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false 
      });
      
      const video = document.getElementById('video');
      video.srcObject = stream;
      document.getElementById('preview').style.display = 'none';
      video.style.display = 'block';
      document.getElementById('btnSnap').disabled = false;
      
      showStatus("Kamera aktif. Silakan foto selfie.", "info");
    } catch (err) {
      showStatus("Gagal membuka kamera. Pastikan izin kamera sudah diberikan.", "error");
    }
  }

  // 2. MENGAMBIL FOTO
  function takePhoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    const ctx = canvas.getContext('2d');
    // Mirroring hasil foto agar tidak terbalik
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
    
    // Tampilkan ke image preview
    preview.src = fotoBase64;
    preview.style.display = 'block';
    video.style.display = 'none';

    document.getElementById('btnSend').disabled = false;
    showStatus("Foto berhasil diambil. Klik Kirim jika sudah sesuai.", "info");
  }

  // 3. MENGIRIM DATA KE GOOGLE APPS SCRIPT
  async function sendData() {
    const nama = document.getElementById('nama').value.trim();
    const acara = document.getElementById('acara').value.trim();

    if (!nama || !acara) {
      showStatus("Nama dan Acara wajib diisi!", "error");
      return;
    }

    if (!fotoBase64) {
      showStatus("Ambil foto terlebih dahulu!", "error");
      return;
    }

    const btnSend = document.getElementById('btnSend');
    btnSend.disabled = true;
    btnSend.innerText = "Mengirim...";
    showStatus("Sedang mengunggah data...", "info");

    // Bungkus Data
    const formData = new URLSearchParams();
    formData.append("nama", nama);
    formData.append("acara", acara);
    formData.append("foto", fotoBase64);

    try {
      // Menggunakan mode mode: 'no-cors' agar lolos batasan browser
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData.toString()
      });

      // Berhasil
      showStatus("✅ Absensi Berhasil Terkirim!", "success");
      btnSend.innerText = "Selesai";

      // Matikan kamera
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

    } catch (err) {
      showStatus("Gagal mengirim data. Coba lagi.", "error");
      btnSend.disabled = false;
      btnSend.innerText = "✅ Kirim Absensi";
    }
  }

  function showStatus(text, type) {
    const el = document.getElementById('status');
    el.innerText = text;
    el.className = type;
    el.style.display = 'block';
  }
</script>

</body>
</html>
